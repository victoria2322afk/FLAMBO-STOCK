services:
  - type: web
    name: flambo-stock
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: TZ_NAME
        value: America/Argentina/Buenos_Aires
