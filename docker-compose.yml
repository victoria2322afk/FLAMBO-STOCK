# Uso:  cp .env.example .env   (editá los valores)   y luego   docker compose up -d --build
services:
  flambo:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      PORT: "3000" # puerto interno; el de afuera se cambia con PORT en .env
    volumes:
      - flambo-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  flambo-data:
